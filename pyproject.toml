[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dom-parser-python"
version = "0.1.0"
description = "A minimal DOM parser written from scratch (no HTML parsing libraries)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "santosh_mandala" }]
keywords = ["dom", "parser", "html"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
domparser = "main:main"

[project.urls]
Repository = "https://github.com/santosh_mandala/dom-parser-python"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
pretty = true
show_error_codes = true
error_summary = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "redundant-cast", "unused-awaitable", "truthy-bool"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".entire", ".opencode"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # comprehensions
    "SIM",    # simplify
    "RUF",    # ruff-specific rules
    "PTH",    # pathlib
    "TID",    # tidy imports
    "ARG",    # unused arguments
    "FA",     # future annotations
    "ICN",    # import conventions
    "PIE",    # misc lints
    "RET",    # return
    "T20",    # no print statements
    "PTH208", # os.replace -> Path.replace
]
ignore = [
    "SIM108", # ternary suggestions often hurt readability
    "RET504", # unnecessary assignment-before-return, sometimes clearer
]

[tool.ruff.lint.per-file-ignores]
"src/main.py" = ["T20"] # console script is expected to write to stdout
"tests/**" = ["ARG", "T20", "TID252"]

[tool.ruff.lint.isort]
known-first-party = ["attributes", "dom", "main", "parser", "tokenizer"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
    "--showlocals",
]
